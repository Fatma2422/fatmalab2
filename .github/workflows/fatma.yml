name: Two-Job Hello World Workflow

on:
  push:
    branches:
      - master

jobs:
  job-one:
    name: First Job
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello from Job One
        run: echo "Hello from Job One!"

  job-two:
    name: Second Job
    needs: job-one # This ensures Job 2 only runs after Job 1 completes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello from Job Two
        run: echo "Hello World from Job Two!"
